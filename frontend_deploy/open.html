<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Opening Listing...</title>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var itemId = params.get('id');
      var rawUrl = params.get('url') || '';
      if (!itemId && rawUrl) {
        var match = rawUrl.match(/\/itm\/(?:[^\/]+\/)?(\d{9,14})/);
        if (match) itemId = match[1];
      }
      var target = itemId ? ('https://www.ebay.com/itm/' + itemId) : (rawUrl || 'https://www.ebay.com');
      window.location.replace(target);
    })();
  </script>
</head>
<body style="background:#0f172a;"></body>
</html>
