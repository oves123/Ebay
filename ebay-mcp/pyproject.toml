[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ebay-mcp"
version = "0.1.0"
description = "eBay Browse API MCP server — buy-side listing search and price intelligence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Keith Cunic" },
]
keywords = ["ebay", "mcp", "ai", "shopping", "price-check", "browse-api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "mcp<2.0.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests>=2.31",
]

[project.scripts]
ebay-mcp = "ebay_mcp.server:main"
ebay-mcp-config = "ebay_mcp.config:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
